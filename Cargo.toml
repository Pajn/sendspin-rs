[package]
name = "sendspin"
version = "0.3.8"
edition = "2021"
authors = ["Sendspin Contributors"]
description = "Hyper-efficient Rust implementation of the Sendspin Protocol for synchronized multi-room audio streaming"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sendspin/sendspin-rs"

[features]
default = ["client", "player"]
# The WebSocket client, its builder, the inbound listener and the connection
# manager. Without it the crate is the message types and clock synchronization,
# which is what a server implementation needs.
client = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:serde_json",
    "dep:uuid",
    "dep:typed-builder",
    "dep:parking_lot",
]
# Decoders and synchronized audio output through cpal.
player = [
    "dep:cpal",
    "dep:flac-codec",
    "dep:opus-rs",
    "dep:crossbeam",
    "dep:parking_lot",
]
native-tls = [
    "client",
    "tokio-tungstenite/native-tls",
    "dep:tokio-native-tls",
    "dep:native-tls",
]

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
tokio-native-tls = { version = "0.3", optional = true }
native-tls = { version = "0.2", optional = true }
futures-util = { version = "0.3", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }

# Error handling
thiserror = "2.0"

# Utilities
log = "0.4"
uuid = { version = "1.23", features = ["v4", "serde"], optional = true }

# Audio output
cpal = { version = "0.18", optional = true }

# Audio codecs
flac-codec = { version = "=1.3.2", optional = true }
opus-rs = { version = "=0.1.23", optional = true }

# Concurrency
crossbeam = { version = "0.8", optional = true }

# Fast mutexes
parking_lot = { version = "0.12", optional = true }
typed-builder = { version = "0.23.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# `realtime` promotes cpal's WASAPI event-loop thread via MMCSS ("Pro Audio"),
# falling back to SetThreadPriority(TIME_CRITICAL). Without it the audio
# callback thread runs at normal priority and can miss engine-period deadlines
# under host load, which surfaces as callback gaps and endpoint-buffer
# starvation. Windows-only: CoreAudio already schedules callback threads
# real-time (and cpal has no macOS audio_thread_priority dependency, so the
# feature would be inert), while Linux promotion needs the dbus/RtKit variant
# (realtime-dbus) plus a system libdbus build dependency.
cpal = { version = "0.18", features = ["realtime"], optional = true }

[dev-dependencies]
serde_json = "1.0"
tokio-test = "0.4"
base64 = "0.22"
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }
mdns-sd = "0.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "basic_client"
required-features = ["client"]

[[example]]
name = "controller_only"
required-features = ["client"]

[[example]]
name = "minimal_test"
required-features = ["client"]

[[example]]
name = "player"
required-features = ["client", "player"]

[[example]]
name = "secure_socket"
required-features = ["native-tls"]

[[example]]
name = "server_initiated_metadata"
required-features = ["client"]
